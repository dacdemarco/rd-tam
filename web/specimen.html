<!doctype html>
<html lang="es" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RD-TAM · Muestrario</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="analysis.css">
  <style>
    body{padding:32px 40px;height:auto;overflow:auto}
    section{margin-bottom:48px}
    .specimen-label{font:400 11px/16px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 16px}
    .swatches,.icons{display:flex;flex-wrap:wrap;gap:16px}
    .swatch{width:136px;border:1px solid var(--rule);background:var(--panel)}
    .swatch i{display:block;height:48px;border-bottom:1px solid var(--rule)}
    .swatch span{display:block;padding:8px;font:400 11px/16px var(--mono)}
    .icon-cell{display:grid;justify-items:center;gap:8px;padding:12px;border:1px solid var(--rule);min-width:96px}
    .icon-cell span{font:400 11px/16px var(--mono)}
    .specimen-icon{fill:currentColor}
    .type p{margin:0 0 12px}
  </style>
</head>
<body>
  <!-- Solo desarrollo: no entra en la build web ni en el paquete. -->
  <button id="specimen-theme" class="primary-button" type="button">Cambiar tema</button>
  <section><p class="specimen-label">Tokens de color</p><div class="swatches" id="swatches"></div></section>
  <section class="type"><p class="specimen-label">Tipografía</p>
    <p style="font:400 22px/32px var(--mono)">Departure Mono 22 — Entrevista.wav</p>
    <p style="font:400 11px/16px var(--mono);letter-spacing:.08em;text-transform:uppercase">Departure Mono 11 — Modelo · 00:00:05 · 100%</p>
    <p style="font:400 22px/32px var(--mono)">Transcripción: podemos buscar palabras y leer su contexto.</p>
  </section>
  <section><p class="specimen-label">Iconos 24 px</p><div class="icons" id="icons-24"></div></section>
  <section><p class="specimen-label">Iconos 48 px</p><div class="icons" id="icons-48"></div></section>
  <script type="module">
    const tokens = ['paper','panel','ink','muted','accent-pastel','action','on-action','data','rule','control','danger'];
    const swatches = () => {
      const css = getComputedStyle(document.documentElement);
      document.querySelector('#swatches').innerHTML = tokens.map(t => `<div class="swatch"><i style="background:var(--${t})"></i><span>--${t}<br>${css.getPropertyValue('--'+t).trim()}</span></div>`).join('');
    };
    const html = await (await fetch('index.html')).text();
    const sprite = new DOMParser().parseFromString(html, 'text/html').querySelector('#rd-sprite');
    document.body.prepend(document.importNode(sprite, true));
    const ids = [...document.querySelectorAll('#rd-sprite symbol')].map(s => s.id);
    for (const size of [24, 48]) {
      document.querySelector(`#icons-${size}`).innerHTML = ids.map(id => `<div class="icon-cell"><svg class="specimen-icon" data-symbol="${id}" width="${size}" height="${size}" aria-hidden="true"><use href="#${id}"/></svg><span>${id}</span></div>`).join('');
    }
    swatches();
    document.querySelector('#specimen-theme').onclick = () => {
      document.documentElement.dataset.theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      swatches();
    };
    window.__specimenReady = true;
  </script>
</body>
</html>
